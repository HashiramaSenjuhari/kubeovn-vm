---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: vmports.anchorvm.io
spec:
  group: anchorvm.io
  names:
    kind: VMPort
    listKind: VMPortList
    plural: vmports
    shortNames:
    - vmp
    singular: vmport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.hypervisor
      name: Hypervisor
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ip
      name: IP
      type: string
    - jsonPath: .status.mac
      name: MAC
      type: string
    - jsonPath: .status.agent.tap
      name: Tap
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VMPort is one libvirt VM network card on a Kube-OVN subnet.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VMPortSpec is the desired network card.
            properties:
              attach:
                properties:
                  domain:
                    description: Domain is the existing libvirt domain to hot-plug
                      into (HotPlug mode only).
                    type: string
                  mode:
                    default: TapOnly
                    description: AttachMode says how the NIC reaches the VM.
                    enum:
                    - TapOnly
                    - HotPlug
                    type: string
                type: object
              hypervisor:
                description: Hypervisor is the name the anchorvm-agent on that host
                  runs with.
                maxLength: 40
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: hypervisor is immutable
                  rule: self == oldSelf
              network:
                properties:
                  dhcpV4Options:
                    description: DHCPv4Options are extra per-port DHCP options, e.g.
                      "mtu=1300". Mutable.
                    type: string
                  ip:
                    description: IP requests a fixed IPv4 address. Empty = Kube-OVN
                      picks one.
                    type: string
                    x-kubernetes-validations:
                    - message: ip is immutable
                      rule: self == oldSelf
                  mac:
                    description: MAC requests a fixed MAC address. Empty = Kube-OVN
                      picks one.
                    pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
                    type: string
                    x-kubernetes-validations:
                    - message: mac is immutable
                      rule: self == oldSelf
                  nad:
                    description: |-
                      NAD is the Kube-OVN NetworkAttachmentDefinition, "namespace/name" or "name"
                      (same namespace as the VMPort).
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: nad is immutable
                      rule: self == oldSelf
                  securityGroups:
                    description: SecurityGroups are Kube-OVN SecurityGroup names.
                      Mutable.
                    items:
                      type: string
                    type: array
                  subnet:
                    description: Subnet is the Kube-OVN Subnet the NIC lives on.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: subnet is immutable
                      rule: self == oldSelf
                required:
                - nad
                - subnet
                type: object
            required:
            - hypervisor
            - network
            type: object
            x-kubernetes-validations:
            - message: attach.domain is required for HotPlug
              rule: '!has(self.attach) || self.attach.mode != ''HotPlug'' || (has(self.attach.domain)
                && self.attach.domain != '''')'
            - message: attach is immutable
              rule: '!has(oldSelf.attach) || !has(self.attach) || self.attach == oldSelf.attach'
          status:
            properties:
              agent:
                description: |-
                  AgentStatus is written only by the agent of spec.hypervisor (enforced by an
                  admission policy); everything else in status is written only by the controller.
                properties:
                  attachedTo:
                    description: AttachedTo is the domain the NIC is hot-plugged into
                      (HotPlug mode).
                    type: string
                  cleanupDone:
                    description: 'CleanupDone is set after deletion: NIC detached,
                      OVS port and tap removed.'
                    type: boolean
                  conditions:
                    items:
                      description: Condition contains details for one aspect of the
                        current state of this API Resource.
                      properties:
                        lastTransitionTime:
                          description: |-
                            lastTransitionTime is the last time the condition transitioned from one status to another.
                            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                          format: date-time
                          type: string
                        message:
                          description: |-
                            message is a human readable message indicating details about the transition.
                            This may be an empty string.
                          maxLength: 32768
                          type: string
                        observedGeneration:
                          description: |-
                            observedGeneration represents the .metadata.generation that the condition was set based upon.
                            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                            with respect to the current state of the instance.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            reason contains a programmatic identifier indicating the reason for the condition's last transition.
                            Producers of specific condition types may define expected values and meanings for this field,
                            and whether the values are considered a guaranteed API.
                            The value should be a CamelCase string.
                            This field may not be empty.
                          maxLength: 1024
                          minLength: 1
                          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                          type: string
                        status:
                          description: status of the condition, one of True, False,
                            Unknown.
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                        type:
                          description: type of condition in CamelCase or in foo.example.com/CamelCase.
                          maxLength: 316
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          type: string
                      required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                      type: object
                    type: array
                  ovnInstalled:
                    description: OVNInstalled is true when ovn-controller has installed
                      flows for the port.
                    type: boolean
                  tap:
                    description: Tap is the host tap device the VM must use.
                    type: string
                  uid:
                    description: UID of the VMPort this report is about (guards against
                      same-name recreation).
                    type: string
                type: object
              anchorPod:
                description: AnchorPod is the never-scheduled pod that holds this
                  port in Kube-OVN.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              ip:
                type: string
              lsp:
                description: LSP is the OVN logical switch port name (the tap's iface-id).
                type: string
              mac:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is a one-word summary for humans; conditions carry
                  the detail.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 40 characters
          rule: size(self.metadata.name) <= 40
    selectableFields:
    - jsonPath: .spec.hypervisor
    served: true
    storage: true
    subresources:
      status: {}
