---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: anchorvm-controller
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - anchorvm.io
  resources:
  - vmports
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - anchorvm.io
  resources:
  - vmports/finalizers
  verbs:
  - update
- apiGroups:
  - anchorvm.io
  resources:
  - vmports/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
